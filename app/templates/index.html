<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8" />
    <title>Banking Analytics Assistant</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body class="dark-mode">
    
    <div class="container">

        <!-- LEFT: CHAT -->
        <div class="chat-panel">

            <div class="chat-header">
                <h2>Banking Assistant</h2>
                <button id="clear-chat-btn" class="clear-btn">Clear Chat</button>
            </div>

            <!-- CHAT MESSAGES -->
            <div id="chat-box"></div>

            <!-- THINKING DOTS  -->
            <div id="thinking" class="thinking" style="display:none;">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <!-- INPUT ROW -->
            <div class="input-row">
                <input id="user-input" placeholder="Ask a question…" />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- RIGHT: RESULTS (DATA + CHART) -->
        <div class="results-container">
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>

            <!-- DATA PANEL -->
            <div class="data-panel">

                <div class="panel-header">Query Results</div>

                <!-- SQL TOGGLE -->
                <button id="toggle-sql" class="toggle-btn">Show SQL</button>

                <!-- PREVIEW TOGGLE -->
                <button id="toggle-preview" class="toggle-btn">Hide Preview</button>

                <!-- ANALYSIS DETAILS TOGGLE -->
                <button id="toggle-analysis" class="toggle-btn">Show Analysis Details</button>

                <!-- SQL BLOCK -->
                <pre id="sql-box" class="sql-block hidden"></pre>

                <!-- DATA PREVIEW -->
                <div id="data-preview-content" class="data-preview">
                    <div id="results-box"></div>
                </div>

                <!-- ANALYSIS DETAILS PANEL -->
                <div id="analysis-details" class="analysis-details hidden"></div>

            </div>

            <!-- CHART PANEL -->
            <div class="chart-panel">
                <div id="chart-loading" class="chart-loading hidden">
                    Loading chart…
                </div>

                <img id="chart-image" class="chart-image hidden" />
            </div>

        </div>

    </div>

    <script src="../static/js/app.js"></script>

</body>

</html>
